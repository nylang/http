name: http public SDK acceptance and source release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: http-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            host: darwin-arm64
          - runner: macos-15-intel
            host: darwin-x86_64
          - runner: ubuntu-24.04
            host: linux-x86_64
          - runner: windows-2022
            host: windows-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Linux SDK runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxml2 zlib1g libstdc++6
      - name: Pinned source qualification (Unix)
        if: runner.os != 'Windows'
        run: python3 -B scripts/ci.py --out-dir "$RUNNER_TEMP/http-ci"
      - name: Pinned source qualification (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          if errorlevel 1 exit /b %errorlevel%
          python -B scripts/ci.py --out-dir "%RUNNER_TEMP%/http-ci"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: acceptance-${{ matrix.host }}
          path: |
            ${{ runner.temp }}/http-ci/**/ci-report.json
            ${{ runner.temp }}/http-ci/**/acceptance.json
            ${{ runner.temp }}/http-ci/**/*.log
          if-no-files-found: error
          retention-days: 14
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: acceptance-*
          path: ${{ runner.temp }}/http-receipts
      - name: Validate exact four-host inputs and preserve original Git manifests
        run: |
          test "$GITHUB_REF_http" = "v0.1.0"
          python3 scripts/release_source.py --package-root . --receipts "$RUNNER_TEMP/http-receipts" --out-dir "$RUNNER_TEMP/http-release"
      - name: Publish verified source assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_http" --draft --title "http 0.1.0" --notes-file docs/release-0.1.0.md
          gh release upload "$GITHUB_REF_http" "$RUNNER_TEMP/http-release/http-0.1.0-source.tar.gz" "$RUNNER_TEMP/http-release/release.json" "$RUNNER_TEMP/http-release/SHA256SUMS"
          gh release edit "$GITHUB_REF_http" --draft=false
